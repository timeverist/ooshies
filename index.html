<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12277d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Ooshie Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="title-row">
      <h1>Ooshie Tracker</h1>
      <button id="exportBtn" class="icon-btn" title="Export as image" aria-label="Export as image">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a1 1 0 0 1 1 1v9.59l3.3-3.3 1.4 1.42-5 5a1 1 0 0 1-1.4 0l-5-5 1.4-1.42 3.3 3.3V4a1 1 0 0 1 1-1ZM4 18h16v2H4v-2Z"/></svg>
      </button>
    </div>

    <div class="progress-row">
      <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
      <div class="progress-label"><strong id="collectedCount">0</strong><span>/ <span id="totalCount">40</span> collected</span></div>
    </div>

    <div class="stats" id="stats">
      <span class="stat"><b id="statMissing">0</b> missing</span>
      <span class="stat"><b id="statDupes">0</b> spares</span>
      <span class="stat sync" id="syncStat" data-state="local">Local only</span>
    </div>

    <div class="search">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 1 0 4.55 13.46l4.24 4.25 1.42-1.42-4.25-4.24A7.5 7.5 0 0 0 10.5 3Zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11Z"/></svg>
      <input id="search" type="search" inputmode="search" autocomplete="off"
             placeholder="Search by name or movie" aria-label="Search ooshies">
      <button id="clearSearch" class="clear-search" type="button" aria-label="Clear search" hidden>&times;</button>
    </div>

    <nav class="filters" id="filters" role="tablist" aria-label="Filter ooshies">
      <button class="filter active" data-filter="all" role="tab" aria-selected="true">All <span class="pill" id="cntAll">40</span></button>
      <button class="filter" data-filter="collected" role="tab" aria-selected="false">Collected <span class="pill" id="cntCollected">0</span></button>
      <button class="filter" data-filter="missing" role="tab" aria-selected="false">Missing <span class="pill" id="cntMissing">40</span></button>
      <button class="filter" data-filter="duplicates" role="tab" aria-selected="false">Duplicates <span class="pill" id="cntDuplicates">0</span></button>
    </nav>
  </div>
</header>

<main>
  <div id="grid" class="grid" aria-live="polite"></div>
  <p id="emptyState" class="empty" hidden></p>
</main>

<footer class="foot">
  <button id="resetBtn" class="text-btn">Reset everything</button>
  <p class="legal">Character images &copy; Disney, Disney/Pixar, MARVEL, &amp; &trade; Lucasfilm Ltd. Personal use only.</p>
</footer>

<!-- Export sheet -->
<dialog id="exportDlg" class="dlg">
  <h2>Export as image</h2>
  <p class="dlg-note">Saves a picture you can text to someone — handy at the shops or for swapping spares.</p>

  <div class="checks">
    <label class="check">
      <input type="checkbox" id="optMissing" checked>
      <span class="check-body"><b>Missing</b><em id="optMissingCount"></em></span>
    </label>
    <label class="check">
      <input type="checkbox" id="optDuplicates" checked>
      <span class="check-body"><b>Duplicates</b><em id="optDuplicatesCount"></em></span>
    </label>
    <label class="check">
      <input type="checkbox" id="optCollected">
      <span class="check-body"><b>Collected</b><em id="optCollectedCount"></em></span>
    </label>
  </div>

  <div class="dlg-actions">
    <button id="doExport" class="btn primary">Save image</button>
    <button id="closeExport" class="btn">Cancel</button>
  </div>
  <p class="dlg-fine" id="exportHint"></p>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
